name: lakehouse-local-setup

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "sh", "-c", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc ready local"]
      interval: 20s
      timeout: 20s
      retries: 3
    networks:
      - infra_network

  aws:
    image: amazon/aws-cli
    container_name: aws-cli
    entrypoint: ["/bin/bash", "-c"]
    volumes:
      - ../raw_data:/seed:ro
    command: >
      "sleep 5 &&
       aws --endpoint-url http://minio:9000 s3 mb s3://raw-data --region eu-west-1 || true
       aws --endpoint-url http://minio:9000 s3 mb s3://bronze --region eu-west-1 || true
       aws --endpoint-url http://minio:9000 s3 sync /seed s3://raw-data/"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: "eu-west-1"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - infra_network


  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    container_name: jupyter
    ports:
      - "8888:8888"    
      - "4040:4040"   
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYSPARK_SUBMIT_ARGS=pyspark-shell
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.allow_origin='*'
    volumes:
      - ../notebooks:/home/jovyan/work
      - ./notebooks/sparkdata:/sparkdata
    depends_on:
      minio:
        condition: service_healthy
      aws:
        condition: service_completed_successfully
    networks:
      - infra_network

networks:
  infra_network:
    driver: bridge
